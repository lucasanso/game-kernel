# Game Kernel CI — Linux (full suite + ASan/UBSan) and Windows (MSVC build of the native
# components, full suite, frozen helper). No secrets are used; the release signing key never
# reaches CI (see docs/BUILD.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — testes completos + sanitizadores
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      GK_NATIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Pacotes do sistema (toolchain C++, Qt 6, libsodium, libyara)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config qt6-base-dev libqt6svg6-dev \
            libgl-dev libegl1 libxkbcommon0 libsodium-dev libyara-dev fonts-dejavu-core clamav p7zip-full
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt
      - name: Testes (Python + C++ controlados pelo pytest)
        run: python -m pytest -q
      - name: Testes com AddressSanitizer + UBSan
        env:
          GK_NATIVE_SANITIZE: "1"
        run: python -m pytest -q tests/native/test_native_ipc.py tests/ipc tests/reports tests/sandbox tests/updates tests/ti

  windows:
    name: Windows — MSVC, testes e auxiliar congelado
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      QT_VERSION: "6.8.3"
      GK_NATIVE_REQUIRED: "1"
      QT_QPA_PLATFORM: offscreen
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Sintaxe do monitor da sandbox (Windows PowerShell 5.1 e PowerShell 7)
        shell: powershell
        run: |
          foreach ($exe in @('powershell.exe', 'pwsh.exe')) {
            & $exe -NoProfile -Command {
              $errors = $null; $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile("$PWD\gamekernel\engines\sandbox\monitor.ps1", [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
              Write-Output "monitor.ps1: sem erros de sintaxe ($($PSVersionTable.PSVersion))"
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt aqtinstall==3.3.0
      - name: Qt (MSVC 2022, 64 bits)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restaurar cache binário do vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-libsodium-yara-v2
      - name: libsodium e libyara (vcpkg, modo clássico)
        id: vcpkg
        shell: pwsh
        # Outside the repository: the root vcpkg.json (Agent A's manifest) would switch vcpkg to
        # manifest mode, where "vcpkg install <ports>" is not accepted.
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium yara --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Salvar cache binário do vcpkg (mesmo que passos seguintes falhem)
        if: steps.vcpkg.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-libsodium-yara-v2
      - name: Testes (Python + C++ MSVC controlados pelo pytest)
        shell: pwsh
        run: |
          $env:GK_CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$($env:VCPKG_INSTALLATION_ROOT -replace '\\','/')/scripts/buildsystems/vcpkg.cmake -DCMAKE_PREFIX_PATH=C:/Qt/$env:QT_VERSION/msvc2022_64"
          python -m pytest -q
      - name: Auxiliar congelado (PyInstaller)
        if: success() || failure()
        run: pyinstaller installer/gk_helper.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Teste do auxiliar congelado
        if: success() || failure()
        shell: pwsh
        run: |
          $env:GK_FROZEN_HELPER = "$PWD\dist\gk-helper\gk-helper.exe"
          python -m pytest -q tests/ipc/test_frozen_helper.py
      - name: Artefatos
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-windows-componentes
          path: |
            dist/gk-helper/
            build/native-updates/Release/gk-update.exe
            build/native-updates/Release/*.dll
          if-no-files-found: error
