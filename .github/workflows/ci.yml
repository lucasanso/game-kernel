# Game Kernel CI — Linux (full suite + ASan/UBSan) and Windows (MSVC build of the native
# components, full suite, frozen helper). No secrets are used; the release signing key never
# reaches CI (see docs/BUILD.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — testes completos + sanitizadores
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      GK_NATIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Pacotes do sistema (toolchain C++, Qt 6, libsodium, libyara)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config qt6-base-dev libqt6svg6-dev \
            libgl-dev libegl1 libxkbcommon0 libsodium-dev libyara-dev libarchive-dev libsqlite3-dev \
            nlohmann-json3-dev fonts-dejavu-core clamav p7zip-full
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt
      - name: Testes (Python + C++ controlados pelo pytest)
        run: python -m pytest -q
      - name: Testes com AddressSanitizer + UBSan
        env:
          GK_NATIVE_SANITIZE: "1"
        run: python -m pytest -q tests/integration tests/helper

  windows:
    name: Windows — MSVC, testes e auxiliar congelado
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      QT_VERSION: "6.8.3"
      GK_NATIVE_REQUIRED: "1"
      QT_QPA_PLATFORM: offscreen
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Sintaxe dos scripts PowerShell (Windows PowerShell 5.1 e PowerShell 7)
        shell: powershell
        run: |
          foreach ($exe in @('powershell.exe', 'pwsh.exe')) {
            & $exe -NoProfile -Command {
              foreach ($script in @('gamekernel\sandbox\monitor.ps1', 'installer\teste-maquina-limpa\teste.ps1',
                                    'installer\teste-maquina-limpa\iniciar.ps1')) {
                $errors = $null; $tokens = $null
                [System.Management.Automation.Language.Parser]::ParseFile("$PWD\$script", [ref]$tokens, [ref]$errors) | Out-Null
                if ($errors) { $errors | ForEach-Object { Write-Error "$script`: $($_.ToString())" }; exit 1 }
                Write-Output "$script`: sem erros de sintaxe ($($PSVersionTable.PSVersion))"
              }
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt aqtinstall==3.3.0
      - name: Qt (MSVC 2022, 64 bits)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restaurar cache binário do vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-core-deps-v4-${{ hashFiles('vcpkg.json', 'vcpkg/overlay-ports/**') }}
      - name: Dependências do núcleo (vcpkg, modo clássico, libyara do overlay do produto)
        id: vcpkg
        shell: pwsh
        # Outside the repository: the root vcpkg.json (Agent A's manifest) would switch vcpkg to
        # manifest mode, where "vcpkg install <ports>" is not accepted.
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Same libyara as the product (vcpkg/overlay-ports/yara: no OpenSSL, no process-memory reader).
          # The whole product is built from the repository root in the tests (core, bridge, UI), so every
          # dependency of vcpkg.json is installed here, in classic mode.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium yara "libarchive[core,bzip2,lz4,lzma,zstd]" sqlite3 nlohmann-json --triplet x64-windows "--overlay-ports=$env:GITHUB_WORKSPACE\vcpkg\overlay-ports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Salvar cache binário do vcpkg (mesmo que passos seguintes falhem)
        if: steps.vcpkg.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-core-deps-v4-${{ hashFiles('vcpkg.json', 'vcpkg/overlay-ports/**') }}
      - name: Testes (Python + C++ MSVC controlados pelo pytest)
        shell: pwsh
        run: |
          $env:GK_CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$($env:VCPKG_INSTALLATION_ROOT -replace '\\','/')/scripts/buildsystems/vcpkg.cmake -DCMAKE_PREFIX_PATH=C:/Qt/$env:QT_VERSION/msvc2022_64 -DVCPKG_MANIFEST_MODE=OFF"
          python -m pytest -q
      - name: Auxiliar congelado (PyInstaller)
        if: success() || failure()
        run: pyinstaller installer/gk_helper.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Teste do auxiliar congelado
        if: success() || failure()
        shell: pwsh
        run: |
          $env:GK_FROZEN_HELPER = "$PWD\dist\gk-helper\gk-helper.exe"
          python -m pytest -q tests/helper/test_frozen_helper.py
      - name: Artefatos
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-windows-componentes
          path: |
            dist/gk-helper/
            build/native-updates/Release/gk-update.exe
            build/native-updates/Release/*.dll
          if-no-files-found: error

  windows-package:
    # The shipped product: core (Agent A's windows-release preset, now with Qt so gk-cli/gk-scanworker/gk-update
    # are built), desktop UI with the same static dependencies, frozen helper, MSVC runtime, installer and
    # portable ZIP. Then the installer is run silently and the *installed* copy is tested end to end
    # (manifest, network imports of every shipped binary, EICAR found by the installed gk-cli, forensic report
    # by the installed helper), uninstalled (user data must survive), and the portable ZIP is tested the same way.
    name: Windows — instalador e versão portátil (produto instalado testado)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      QT_VERSION: "6.8.3"
      QT_QPA_PLATFORM: offscreen
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt aqtinstall==3.3.0
      - name: Qt (MSVC 2022, 64 bits)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restaurar cache binário do vcpkg (dependências estáticas do núcleo)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache-static
          key: vcpkg-${{ runner.os }}-static-md-${{ hashFiles('vcpkg.json', 'vcpkg/overlay-ports/**') }}
      - name: Produto (gk-cli, gk-scanworker, gk-update, GameKernel) pelo preset windows-release, com Qt
        id: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-release -DCMAKE_PREFIX_PATH="C:/Qt/$env:QT_VERSION/msvc2022_64" -DGK_BUILD_BINDINGS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release --target gk-cli gk-scanworker gk-update GameKernel
          exit $LASTEXITCODE
      - name: Salvar cache binário do vcpkg (mesmo que passos seguintes falhem)
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true' && hashFiles('.vcpkg-cache-static/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache-static
          key: vcpkg-${{ runner.os }}-static-md-${{ hashFiles('vcpkg.json', 'vcpkg/overlay-ports/**') }}
      - name: Auxiliar congelado (PyInstaller)
        run: pyinstaller installer/gk_helper.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Montar a distribuição (pasta do produto, manifesto de integridade assinado, ZIP portátil)
        shell: pwsh
        run: |
          # The release key never reaches CI: CI packages are signed with a throwaway key generated here, whose
          # public half is shipped in signatures/keys (so the installed copy verifies itself) and whose private
          # half is discarded with the runner. Not for distribution to users.
          python tools/gk_keygen.py --out-dir "$env:RUNNER_TEMP\ci-key" --name ci-efemera --no-password
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crt = & $vswhere -latest -products * -find "VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" | Select-Object -Last 1
          if (-not $crt) { Write-Error "runtime MSVC (Microsoft.VC143.CRT) não encontrado"; exit 1 }
          $ver = python tools/make_distribution.py --print-version
          "GK_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GK_CRT=$crt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/make_distribution.py --app build/windows-release/cpp/app/Release/GameKernel.exe `
            --bin build/windows-release/cpp/cli/Release/gk-cli.exe `
            --bin build/windows-release/cpp/worker/Release/gk-scanworker.exe `
            --bin build/windows-release/cpp/updates/Release/gk-update.exe `
            --helper dist/gk-helper --crt-dir $crt --key "$env:RUNNER_TEMP\ci-key\ci-efemera.key" --no-password `
            --out dist/GameKernel --portable-zip "dist/GameKernel-$ver-portable.zip"
          exit $LASTEXITCODE
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=$env:GK_VERSION" "/DSourceDir=$PWD\dist\GameKernel" "/DOutputDir=$PWD\dist" installer\gamekernel.iss
          exit $LASTEXITCODE
      - name: Instalação silenciosa, testes do produto instalado e desinstalação
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\GameKernel instalado"
          $log = "$env:RUNNER_TEMP\instalacao.log"
          $p = Start-Process -FilePath "dist\GameKernel-$env:GK_VERSION-setup.exe" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$target`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; exit $p.ExitCode }
          $env:GK_INSTALLED_DIR = $target
          $env:GK_EXPECT_SIGNED = "1"
          python -m pytest -q -rs tests/integration/test_distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # User data (quarantine, history) must survive the uninstallation.
          $data = "$env:LOCALAPPDATA\GameKernel"
          New-Item -ItemType Directory -Force -Path "$data\quarantine" | Out-Null
          Set-Content -Path "$data\quarantine\marcador.txt" -Value "dados do usuário"
          Start-Process -FilePath "$target\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller re-launches itself from %TEMP%; wait for it to finish removing the program.
          for ($i = 0; $i -lt 120 -and (Test-Path "$target\GameKernel.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$target\GameKernel.exe") { Write-Error "a desinstalação não removeu o programa"; exit 1 }
          if (-not (Test-Path "$data\quarantine\marcador.txt")) { Write-Error "a desinstalação apagou dados do usuário"; exit 1 }
          Write-Output "Desinstalação: programa removido, dados do usuário preservados."
      - name: Versão portátil (extraída e testada)
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\portatil"
          Expand-Archive -Path "dist\GameKernel-$env:GK_VERSION-portable.zip" -DestinationPath $dest
          if (-not (Test-Path "$dest\GameKernel\portable.flag")) { Write-Error "portable.flag ausente"; exit 1 }
          $env:GK_INSTALLED_DIR = "$dest\GameKernel"
          $env:GK_EXPECT_SIGNED = "1"
          python -m pytest -q -rs tests/integration/test_distribution.py
          exit $LASTEXITCODE
      - name: Kit de teste em máquina limpa (installer/teste-maquina-limpa/teste.ps1, aqui com a chave descartável)
        shell: pwsh
        run: |
          # The same script the publisher runs in Windows Sandbox; here it validates the script itself (this runner
          # is not a clean machine and has no desktop for the window step).
          $kid = python tools/release_sign.py key-id "$env:RUNNER_TEMP\ci-key\ci-efemera.pub"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\teste-maquina-limpa\teste.ps1 `
            -Pasta "$PWD\dist" -ChaveEsperada $kid -SemPausa -SemInterface
          exit $LASTEXITCODE
      - name: Preparar a versão de release com a chave pública do publicador (installer/release/release.pub)
        id: release-prep
        if: hashFiles('installer/release/release.pub') != ''
        shell: pwsh
        run: |
          # Same binaries as above; the folder ships the publisher's public key and an unsigned manifest. The
          # private key never comes here: the manifest is signed on the publisher's computer (docs/RELEASE.md).
          python tools/make_distribution.py --app build/windows-release/cpp/app/Release/GameKernel.exe `
            --bin build/windows-release/cpp/cli/Release/gk-cli.exe `
            --bin build/windows-release/cpp/worker/Release/gk-scanworker.exe `
            --bin build/windows-release/cpp/updates/Release/gk-update.exe `
            --helper dist/gk-helper --crt-dir $env:GK_CRT --public-key installer/release/release.pub `
            --out dist/release/GameKernel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist/release/manifesto | Out-Null
          Copy-Item dist/release/GameKernel/integrity_manifest.json dist/release/manifesto/
          Copy-Item tools/release_sign.py dist/release/manifesto/
          $kid = python tools/release_sign.py key-id installer/release/release.pub
          @{ versao = $env:GK_VERSION; execucao = [long]"${{ github.run_id }}"; commit = "${{ github.sha }}"; chave = $kid } |
            ConvertTo-Json | Set-Content -Path dist/release/manifesto/preparo.json -Encoding utf8
          Write-Output "Versão $env:GK_VERSION preparada para a chave $kid na execução ${{ github.run_id }}."
      - name: Artefato da versão preparada (pasta completa, aguardando assinatura)
        if: steps.release-prep.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-release-preparada
          path: dist/release/GameKernel/
          retention-days: 90
          if-no-files-found: error
      - name: Artefato para assinar (manifesto e preparo.json)
        if: steps.release-prep.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-release-manifesto
          path: dist/release/manifesto/
          retention-days: 90
          if-no-files-found: error
      - name: Artefatos (instalador e versão portátil)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-windows-instalador
          path: |
            dist/GameKernel-*-setup.exe
            dist/GameKernel-*-portable.zip
          if-no-files-found: warn

  release-final:
    # The signed release. Runs only when installer/release/assinatura.json exists (the publisher signed the manifest
    # of a prepared folder on their own computer): the folder prepared by that CI run is downloaded — no rebuild,
    # so the signed hashes match —, the signature is attached and verified, the installer and the portable ZIP are
    # built and the installed product is tested, signed by the publisher's key.
    name: Windows — versão de release assinada (com installer/release/assinatura.json)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Há uma assinatura de release?
        id: plano
        shell: pwsh
        run: |
          if (-not (Test-Path installer/release/assinatura.json)) {
            Write-Output "Sem installer/release/assinatura.json: nada a finalizar."
            "ativo=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $a = Get-Content installer/release/assinatura.json -Raw | ConvertFrom-Json
          if ("$($a.execucao)" -notmatch '^[0-9]{5,20}$') { Write-Error "assinatura.json sem 'execucao' válida"; exit 1 }
          "ativo=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "execucao=$($a.execucao)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Finalizando a versão $($a.versao), preparada na execução $($a.execucao), chave $($a.chave)."
      - uses: actions/setup-python@v5
        if: steps.plano.outputs.ativo == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências Python
        if: steps.plano.outputs.ativo == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Pasta preparada pela execução indicada em assinatura.json
        if: steps.plano.outputs.ativo == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gamekernel-release-preparada
          path: dist/release/GameKernel
          run-id: ${{ steps.plano.outputs.execucao }}
          github-token: ${{ github.token }}
      - name: Anexar e conferir a assinatura, ZIP portátil
        if: steps.plano.outputs.ativo == 'true'
        shell: pwsh
        run: |
          $ver = (Get-Content dist/release/GameKernel/integrity_manifest.json -Raw | ConvertFrom-Json).version
          if ($ver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { Write-Error "versão inválida no manifesto: $ver"; exit 1 }
          "GK_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $kid = python tools/release_sign.py key-id installer/release/release.pub
          "GK_RELEASE_KEY=$kid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/release_sign.py attach dist/release/GameKernel --signature installer/release/assinatura.json `
            --expect-key installer/release/release.pub --portable-zip "dist/final/GameKernel-$ver-portable.zip"
          exit $LASTEXITCODE
      - name: Instalador (Inno Setup)
        if: steps.plano.outputs.ativo == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=$env:GK_VERSION" "/DSourceDir=$PWD\dist\release\GameKernel" "/DOutputDir=$PWD\dist\final" installer\gamekernel.iss
          exit $LASTEXITCODE
      - name: Produto instalado, assinado pela chave do publicador
        if: steps.plano.outputs.ativo == 'true'
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\GameKernel release"
          $log = "$env:RUNNER_TEMP\instalacao.log"
          $p = Start-Process -FilePath "dist\final\GameKernel-$env:GK_VERSION-setup.exe" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$target`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; exit $p.ExitCode }
          $env:GK_INSTALLED_DIR = $target
          $env:GK_EXPECT_SIGNED = "1"
          $env:GK_EXPECT_KEY_ID = $env:GK_RELEASE_KEY
          python -m pytest -q -rs tests/integration/test_distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process -FilePath "$target\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 120 -and (Test-Path "$target\GameKernel.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$target\GameKernel.exe") { Write-Error "a desinstalação não removeu o programa"; exit 1 }
      - name: Kit de teste em máquina limpa com o instalador final
        if: steps.plano.outputs.ativo == 'true'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\teste-maquina-limpa\teste.ps1 `
            -Pasta "$PWD\dist\final" -ChaveEsperada $env:GK_RELEASE_KEY -SemPausa -SemInterface
          exit $LASTEXITCODE
      - name: Versão portátil final
        if: steps.plano.outputs.ativo == 'true'
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\portatil"
          Expand-Archive -Path "dist\final\GameKernel-$env:GK_VERSION-portable.zip" -DestinationPath $dest
          $env:GK_INSTALLED_DIR = "$dest\GameKernel"
          $env:GK_EXPECT_SIGNED = "1"
          $env:GK_EXPECT_KEY_ID = $env:GK_RELEASE_KEY
          python -m pytest -q -rs tests/integration/test_distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\final\GameKernel-* | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path dist\final\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\final\SHA256SUMS.txt
      - name: Artefatos da versão final (instalador, portátil, SHA256SUMS)
        if: steps.plano.outputs.ativo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-${{ env.GK_VERSION }}-release
          path: |
            dist/final/GameKernel-*-setup.exe
            dist/final/GameKernel-*-portable.zip
            dist/final/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
