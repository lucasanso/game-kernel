# Game Kernel CI — Linux (full suite + ASan/UBSan) and Windows (MSVC build of the native
# components, full suite, frozen helper). No secrets are used; the release signing key never
# reaches CI (see docs/BUILD.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — testes completos + sanitizadores
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      GK_NATIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Pacotes do sistema (toolchain C++, Qt 6, libsodium, libyara)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config qt6-base-dev libqt6svg6-dev \
            libgl-dev libegl1 libxkbcommon0 libsodium-dev libyara-dev fonts-dejavu-core clamav p7zip-full
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt
      - name: Testes (Python + C++ controlados pelo pytest)
        run: python -m pytest -q
      - name: Testes com AddressSanitizer + UBSan
        env:
          GK_NATIVE_SANITIZE: "1"
        run: python -m pytest -q tests/integration tests/helper

  windows:
    name: Windows — MSVC, testes e auxiliar congelado
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      QT_VERSION: "6.8.3"
      GK_NATIVE_REQUIRED: "1"
      QT_QPA_PLATFORM: offscreen
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Sintaxe do monitor da sandbox (Windows PowerShell 5.1 e PowerShell 7)
        shell: powershell
        run: |
          foreach ($exe in @('powershell.exe', 'pwsh.exe')) {
            & $exe -NoProfile -Command {
              $errors = $null; $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile("$PWD\gamekernel\sandbox\monitor.ps1", [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
              Write-Output "monitor.ps1: sem erros de sintaxe ($($PSVersionTable.PSVersion))"
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt aqtinstall==3.3.0
      - name: Qt (MSVC 2022, 64 bits)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restaurar cache binário do vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-libsodium-yara-v3-${{ hashFiles('vcpkg/overlay-ports/**') }}
      - name: libsodium e libyara (vcpkg, modo clássico, libyara do overlay do produto)
        id: vcpkg
        shell: pwsh
        # Outside the repository: the root vcpkg.json (Agent A's manifest) would switch vcpkg to
        # manifest mode, where "vcpkg install <ports>" is not accepted.
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Same libyara as the product (vcpkg/overlay-ports/yara: no OpenSSL, no process-memory reader).
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium yara --triplet x64-windows "--overlay-ports=$env:GITHUB_WORKSPACE\vcpkg\overlay-ports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Salvar cache binário do vcpkg (mesmo que passos seguintes falhem)
        if: steps.vcpkg.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-libsodium-yara-v3-${{ hashFiles('vcpkg/overlay-ports/**') }}
      - name: Testes (Python + C++ MSVC controlados pelo pytest)
        shell: pwsh
        run: |
          $env:GK_CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$($env:VCPKG_INSTALLATION_ROOT -replace '\\','/')/scripts/buildsystems/vcpkg.cmake -DCMAKE_PREFIX_PATH=C:/Qt/$env:QT_VERSION/msvc2022_64"
          python -m pytest -q
      - name: Auxiliar congelado (PyInstaller)
        if: success() || failure()
        run: pyinstaller installer/gk_helper.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Teste do auxiliar congelado
        if: success() || failure()
        shell: pwsh
        run: |
          $env:GK_FROZEN_HELPER = "$PWD\dist\gk-helper\gk-helper.exe"
          python -m pytest -q tests/helper/test_frozen_helper.py
      - name: Artefatos
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-windows-componentes
          path: |
            dist/gk-helper/
            build/native-updates/Release/gk-update.exe
            build/native-updates/Release/*.dll
          if-no-files-found: error

  windows-package:
    # The shipped product: core (Agent A's windows-release preset, now with Qt so gk-cli/gk-scanworker/gk-update
    # are built), desktop UI with the same static dependencies, frozen helper, MSVC runtime, installer and
    # portable ZIP. Then the installer is run silently and the *installed* copy is tested end to end
    # (manifest, network imports of every shipped binary, EICAR found by the installed gk-cli, forensic report
    # by the installed helper), uninstalled (user data must survive), and the portable ZIP is tested the same way.
    name: Windows — instalador e versão portátil (produto instalado testado)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      QT_VERSION: "6.8.3"
      QT_QPA_PLATFORM: offscreen
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt aqtinstall==3.3.0
      - name: Qt (MSVC 2022, 64 bits)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restaurar cache binário do vcpkg (dependências estáticas do núcleo)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache-static
          key: vcpkg-${{ runner.os }}-static-md-${{ hashFiles('vcpkg.json', 'vcpkg/overlay-ports/**') }}
      - name: Produto (gk-cli, gk-scanworker, gk-update, GameKernel) pelo preset windows-release, com Qt
        id: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-release -DCMAKE_PREFIX_PATH="C:/Qt/$env:QT_VERSION/msvc2022_64" -DGK_BUILD_BINDINGS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release --target gk-cli gk-scanworker gk-update GameKernel
          exit $LASTEXITCODE
      - name: Salvar cache binário do vcpkg (mesmo que passos seguintes falhem)
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true' && hashFiles('.vcpkg-cache-static/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache-static
          key: vcpkg-${{ runner.os }}-static-md-${{ hashFiles('vcpkg.json', 'vcpkg/overlay-ports/**') }}
      - name: Auxiliar congelado (PyInstaller)
        run: pyinstaller installer/gk_helper.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Montar a distribuição (pasta do produto, manifesto de integridade assinado, ZIP portátil)
        shell: pwsh
        run: |
          # The release key never reaches CI: CI packages are signed with a throwaway key generated here, whose
          # public half is shipped in signatures/keys (so the installed copy verifies itself) and whose private
          # half is discarded with the runner. Not for distribution to users.
          python tools/gk_keygen.py --out-dir "$env:RUNNER_TEMP\ci-key" --name ci-efemera --no-password
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crt = & $vswhere -latest -products * -find "VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" | Select-Object -Last 1
          if (-not $crt) { Write-Error "runtime MSVC (Microsoft.VC143.CRT) não encontrado"; exit 1 }
          $ver = python tools/make_distribution.py --print-version
          "GK_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/make_distribution.py --app build/windows-release/cpp/app/Release/GameKernel.exe `
            --bin build/windows-release/cpp/cli/Release/gk-cli.exe `
            --bin build/windows-release/cpp/worker/Release/gk-scanworker.exe `
            --bin build/windows-release/cpp/updates/Release/gk-update.exe `
            --helper dist/gk-helper --crt-dir $crt --key "$env:RUNNER_TEMP\ci-key\ci-efemera.key" --no-password `
            --out dist/GameKernel --portable-zip "dist/GameKernel-$ver-portable.zip"
          exit $LASTEXITCODE
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=$env:GK_VERSION" "/DSourceDir=$PWD\dist\GameKernel" "/DOutputDir=$PWD\dist" installer\gamekernel.iss
          exit $LASTEXITCODE
      - name: Instalação silenciosa, testes do produto instalado e desinstalação
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\GameKernel instalado"
          $log = "$env:RUNNER_TEMP\instalacao.log"
          $p = Start-Process -FilePath "dist\GameKernel-$env:GK_VERSION-setup.exe" -Wait -PassThru `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$target`"", "/LOG=`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; exit $p.ExitCode }
          $env:GK_INSTALLED_DIR = $target
          $env:GK_EXPECT_SIGNED = "1"
          python -m pytest -q -rs tests/integration/test_distribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # User data (quarantine, history) must survive the uninstallation.
          $data = "$env:LOCALAPPDATA\GameKernel"
          New-Item -ItemType Directory -Force -Path "$data\quarantine" | Out-Null
          Set-Content -Path "$data\quarantine\marcador.txt" -Value "dados do usuário"
          Start-Process -FilePath "$target\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller re-launches itself from %TEMP%; wait for it to finish removing the program.
          for ($i = 0; $i -lt 120 -and (Test-Path "$target\GameKernel.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$target\GameKernel.exe") { Write-Error "a desinstalação não removeu o programa"; exit 1 }
          if (-not (Test-Path "$data\quarantine\marcador.txt")) { Write-Error "a desinstalação apagou dados do usuário"; exit 1 }
          Write-Output "Desinstalação: programa removido, dados do usuário preservados."
      - name: Versão portátil (extraída e testada)
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\portatil"
          Expand-Archive -Path "dist\GameKernel-$env:GK_VERSION-portable.zip" -DestinationPath $dest
          if (-not (Test-Path "$dest\GameKernel\portable.flag")) { Write-Error "portable.flag ausente"; exit 1 }
          $env:GK_INSTALLED_DIR = "$dest\GameKernel"
          $env:GK_EXPECT_SIGNED = "1"
          python -m pytest -q -rs tests/integration/test_distribution.py
          exit $LASTEXITCODE
      - name: Artefatos (instalador e versão portátil)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamekernel-windows-instalador
          path: |
            dist/GameKernel-*-setup.exe
            dist/GameKernel-*-portable.zip
          if-no-files-found: warn
